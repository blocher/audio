# First deploy, before certbot: plain HTTP. `certbot --nginx -d audio.benlocher.com` then adds TLS.
upstream backend_audio {
    server 127.0.0.1:8008;
}

server {
    listen 80;
    listen [::]:80;
    server_name audio.benlocher.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    include /var/www/audio.benlocher.com/deploy/nginx-common.inc;
}
