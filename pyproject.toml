[tool.ruff]
target-version = "py313"
line-length = 119
extend-exclude = ["backend/*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["backend"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "audible_books", "podcasts", "local_audio", "transcripts", "yoto"]
